# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Add school, public contact email, and portrait only when ready to publish them.
# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Jiaxin Li | Academic Homepage"
title_separator          : "-"
name                     : &name "Jiaxin Li"
description              : &description "Academic homepage of Jiaxin Li. Research interests: privacy-preserving machine learning, federated learning, secure multi-party computation, and applied cryptography."   # Update this with a general description of your site, this is the default if not overridden by a page
url                      : "https://kashion-man.github.io"
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "kashion-man/kashion-man.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : # TODO: put your photo in images/ and set e.g. "profile.png" (if the template expects it there)
  name             : "Jiaxin Li"
  pronouns         : # example: "she/her"  
  bio              : "Undergraduate researcher interested in privacy-preserving machine learning, federated learning, and applied cryptography."
  location         : # Optional: city/country
  employer         : # TODO: fill in your university after checking its official English name
  uri              : # URL
  email            : # TODO: add an email address you are comfortable publishing 

  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : # Add only if you have a profile
  inspire-hep      : # URL
  impactstory      : # URL
  orcid            : # Add only if you have an ORCID
  semantic         : # URL
  ssrn             : # URL
  pubmed           :
  researchgate     : # URL
  scopus           : # URL
  zotero           : # URL


  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "kashion-man"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  artstation       : # Username
  bluesky          :
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : # Username
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : # Username for X / Twitter
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
# Reading Files
include:
  - _pages
  - files
